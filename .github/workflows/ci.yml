name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  quality:
    name: Format, analyze and version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: python3 scripts/test-version.py
      - name: Validate version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            python3 scripts/check-version.py --check-changelog --tag "$RELEASE_TAG"
          else
            python3 scripts/check-version.py --check-changelog
          fi

  test:
    name: Flutter tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --reporter expanded

  windows:
    name: Windows x64 build, EXE and ZIP
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - name: Package app-local CRT and validate ZIP
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          $crt = Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Filter msvcp140.dll -Recurse |
            Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC\d+\.CRT\\' -and $_.FullName -notmatch '\\onecore\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Redistributable x64 CRT not found' }
          ./scripts/package-windows.ps1 -RuntimeDirectory $crt.DirectoryName
      - name: Build EXE installer
        shell: pwsh
        run: |
          ./scripts/package-windows-installer.ps1
          $installer = Get-ChildItem dist/windows/*-setup.exe | Select-Object -First 1
          ./scripts/verify-windows-installer.ps1 -InstallerPath $installer.FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS arm64 build and helper checks
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 scripts/test-helper.py
      - run: python3 scripts/test-macos-proxy-recovery.py
      - run: python3 scripts/test-macos-port-cleanup.py
      - run: python3 scripts/test-macos-quit.py
      - run: python3 scripts/test-macos-tray-position.py
      - run: sh scripts/prepare-core.sh
      - run: sh scripts/build-macos-ci.sh
      - name: Validate app TUN forwarding and crash cleanup
        run: python3 scripts/test-macos-tun-app.py --sudo-authorization
      - name: Package and verify DMG
        run: sh scripts/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64
          path: |
            dist/macos/*.dmg
            dist/macos/*.sha256
          if-no-files-found: error
          retention-days: 14

  checks:
    name: CI passed
    if: always()
    needs: [quality, test, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$MACOS_RESULT" = success

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-version.py --check-changelog --tag "$RELEASE_TAG" --require-main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            prerelease=()
            if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
